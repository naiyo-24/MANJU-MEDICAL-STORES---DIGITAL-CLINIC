server {
  listen 5194;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache HTML, version info, or bootloader JS
  location ~* \.(html|json)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    expires 0;
  }

  # Static assets (images, fonts, canvaskit wasm)
  location ~* \.(ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
    expires 1h;
    add_header Cache-Control "public, no-transform";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}